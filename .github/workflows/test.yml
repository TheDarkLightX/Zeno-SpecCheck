name: reference-and-boundary-tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m zeno_speccheck evolve examples/authorization.json --max-evaluations 64 --out runs/auth.json
      - run: python -m zeno_speccheck replay examples/authorization.json runs/auth.json
      - run: python -m zeno_speccheck evolve examples/deflationary_exit.json --max-evaluations 512 --out runs/exit.json
      - run: python -m zeno_speccheck replay examples/deflationary_exit.json runs/exit.json
      - run: python -m zeno_speccheck agent-request examples/deflationary_exit.json --report runs/exit.json --out runs/next-request.json
      - run: python scripts/run_exit_demo.py --out runs/exit-demo
